<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span>&#9992;</span> SkyBook
    </div>

    <h1>Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account</p>

    @if (error) {
      <div class="alert-error">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          [class.invalid]="emailCtrl.invalid && emailCtrl.touched"
        />
        @if (emailCtrl.invalid && emailCtrl.touched) {
          <span class="field-error">Valid email required</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.invalid]="passwordCtrl.invalid && passwordCtrl.touched"
        />
        @if (passwordCtrl.invalid && passwordCtrl.touched) {
          <span class="field-error">Minimum 6 characters</span>
        }
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="forgot-link">
      <a routerLink="/forgot-password">Forgot your password?</a>
    </p>

    <p class="auth-switch">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
